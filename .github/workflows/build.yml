name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Vaguul.CodexAccountSwitcher.sln -c Release -warnaserror
      - run: dotnet run --project tests/Vaguul.CodexAccountSwitcher.Tests -c Release --no-build
